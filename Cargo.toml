[workspace]
resolver = "2"
members = [
    "crates/garnet-protocol",
    "crates/garnet-data",
    "crates/garnet-world",
    "crates/garnet-api",
    "crates/garnet-mods",
    "crates/garnet-admin",
    "crates/garnet-voice",
    "crates/garnet-server",
]
# The SDK and example mods build for wasm32, so they are separate projects.
exclude = ["sdk/rust", "examples/mods"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/garnet-mc/garnet"

[workspace.dependencies]
garnet-protocol = { path = "crates/garnet-protocol" }
garnet-data = { path = "crates/garnet-data" }
garnet-world = { path = "crates/garnet-world" }
garnet-api = { path = "crates/garnet-api" }
garnet-mods = { path = "crates/garnet-mods" }
garnet-admin = { path = "crates/garnet-admin" }
garnet-voice = { path = "crates/garnet-voice" }

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
