[package]
name = "garnet-admin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = { version = "0.6.0", features = ["getrandom", "alloc"] }
axum = { version = "0.8.9", features = ["ws"] }
hex = "0.4.3"
garnet-api.workspace = true
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
anyhow = "1.0.104"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
